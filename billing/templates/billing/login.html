<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Billing Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0d0f14;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-wrap {
            width: 100%;
            max-width: 380px;
            padding: 0 16px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 52px; height: 52px;
            background: #6366f1;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin: 0 auto 12px;
        }
        .logo-title {
            font-size: 20px; font-weight: 700; margin-bottom: 3px;
        }
        .logo-sub {
            font-size: 13px; color: #6b7280;
        }
        .card {
            background: #161922;
            border: 1px solid #23262f;
            border-radius: 14px;
            padding: 28px 24px;
        }
        .form-group { margin-bottom: 16px; }
        .form-label {
            font-size: 12px; font-weight: 600; color: #6b7280;
            display: block; margin-bottom: 5px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-control {
            width: 100%; padding: 10px 14px;
            border: 1px solid #23262f;
            border-radius: 8px;
            background: rgba(255,255,255,.04);
            color: #e8eaf0;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }
        .form-control:focus { border-color: #6366f1; }
        .btn-login {
            width: 100%; padding: 12px;
            background: #6366f1; color: #fff;
            border: none; border-radius: 9px;
            font-size: 15px; font-weight: 700;
            cursor: pointer;
            transition: opacity .15s;
            margin-top: 6px;
        }
        .btn-login:hover { opacity: 0.9; }
        .error {
            background: rgba(239,68,68,.1);
            border: 1px solid rgba(239,68,68,.3);
            color: #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footnote {
            text-align: center;
            font-size: 12px;
            color: #374151;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="logo">
        <div class="logo-icon">💳</div>
        <div class="logo-title">Billing Dashboard</div>
        <div class="logo-sub">Staff access only</div>
    </div>

    <div class="card">
        {% if error %}
        <div class="error"><span>⚠</span> {{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="staff_username" autofocus required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <div class="footnote">
        This portal is for cashiers, managers, and owners only.
    </div>
</div>
</body>
</html>
